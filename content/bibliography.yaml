# Every source the curriculum is allowed to cite.
#
# A unit may not reference a key that is not in this file; the validator refuses
# it. Each entry names what it is being relied on for, so a wrong citation is
# visible rather than decorative.
#
# status: needs_citation means the tradition is named and the claim is real, but
# the reference itself has not been checked against the literature. Fabricating
# authors, years or titles to make an entry look verified is forbidden by the
# working agreement. These become "verified" only after someone reads the source.

- key: vanpatten-input-processing
  status: needs_citation
  area: sla
  authors: VanPatten
  claim: >
    Learners should process a form in comprehension before being asked to
    produce it. Structured input activities make the target form the only cue
    to meaning, so it cannot be skipped.

- key: long-focus-on-form
  status: needs_citation
  area: sla
  authors: Long
  claim: >
    Grammar is taught inside meaning-primary activity rather than as isolated
    paradigm drill. Justifies having no screen that is only a table.

- key: roediger-karpicke-retrieval
  status: needs_citation
  area: memory
  authors: Roediger and Karpicke
  claim: >
    Retrieval practice beats restudy for retention, so production and cued
    recall are preferred over recognition once an item is past introduction.

- key: cepeda-distributed-practice
  status: needs_citation
  area: memory
  authors: Cepeda and colleagues
  claim: >
    Spacing reviews at expanding intervals improves long term retention.
    Justifies scheduling with FSRS rather than massed review.

- key: interleaving-over-blocking
  status: needs_citation
  area: memory
  claim: >
    Blocked practice produces better in-session performance and worse
    retention than interleaved practice. Justifies mixing structures within a
    session even though it feels harder to the learner.

- key: lyster-ranta-feedback
  status: needs_citation
  area: sla
  authors: Lyster and Ranta
  claim: >
    Prompts that push a learner to self-correct outperform recasts that hand
    over the correct model. Justifies the escalation ladder from clarification
    request to explicit correction.

- key: pienemann-processability
  status: needs_citation
  area: sla
  authors: Pienemann
  claim: >
    Structures are acquired in a developmental order constrained by what the
    learner can process, not by how simple they look. Justifies placing
    nominalized subordination late despite its frequency.

- key: logan-lively-pisoni-hvpt
  status: needs_citation
  area: l2-speech
  authors: Logan, Lively and Pisoni
  year: 1991
  claim: >
    Training perception with many talkers in many phonetic environments
    produces category learning that transfers to new talkers.

- key: flege-slm
  status: needs_citation
  area: l2-speech
  authors: Flege
  claim: >
    Second language sounds are assimilated to first language categories, and
    how close the assimilation is predicts the difficulty. Used to choose the
    contrast inventory for perception training.

- key: best-pam
  status: needs_citation
  area: l2-speech
  authors: Best
  claim: >
    Perceptual assimilation patterns predict which non-native contrasts are
    hard to discriminate.

- key: lobanov-normalization
  status: needs_citation
  area: l2-speech
  authors: Lobanov
  claim: >
    Vowel formants must be speaker-normalized before they are compared across
    talkers. The default normalization for the production feedback module.

- key: turkish-reference-grammar
  status: needs_citation
  area: turkish
  claim: >
    The description of Turkish vowel harmony, voicing assimilation, buffer
    consonants and stem alternations encoded in content/l2/tr/morphology/.

- key: turkish-corpus-frequency
  status: needs_citation
  area: turkish
  claim: >
    Corpus frequency lists (Turkish National Corpus or TS Corpus) used to band
    the lexicon. No band is assigned in the lexicon until this is real.
