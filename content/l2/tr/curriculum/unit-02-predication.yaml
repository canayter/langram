id: unit-02-predication
order: 2
title: Saying what something is
rationale: >
  English speakers arrive looking for the verb "to be" and do not find one.
  Turkish marks predication with a suffix on the noun or adjective itself:
  öğrenciyim is one word meaning "I am a student". The structure is not
  difficult once seen, but it is invisible until it is pointed at, because
  learners are listening for a separate word that never comes.

  This unit is also where fourfold harmony earns its keep. The predicative
  suffixes carry the I archiphoneme, so the learner now has to choose between
  four shapes rather than two, on a structure they want to use immediately.

  The third person is deliberately taught as bare. Textbooks often present
  -DIr as the third person copula, but in speech the unmarked form is bare
  nominal predication, and -DIr is formal or generic. Teaching -DIr first
  produces learners who sound like a public notice.
research_refs:
  - vanpatten-input-processing
  - long-focus-on-form
  - turkish-reference-grammar
prerequisites:
  - unit-01-vowel-harmony

concepts:
  - id: fourfold-harmony
    name: Fourfold harmony (the I archiphoneme)
    type: grammatical_feature
    why_hard: >
      Two features have to be tracked at once, backness and rounding, and
      rounding is the one English speakers drop. The common error is to use the
      unrounded shape everywhere, giving doktorim for doktorum, because the
      learner heard backness and stopped there.
    intro: >
      The suffix you are about to meet has four shapes instead of two, because it
      tracks two things about the last vowel of the stem rather than one: whether it
      is back or front, and whether it is rounded or not. doktor ends in a back,
      rounded vowel, so its shape is doktorum, not doktorim. Backness alone is not
      enough here. The exercises below ask you to notice both features before you
      are asked to choose a shape yourself.
    teaches_suffixes: [PRED1SG, PRED1PL]
    exercises:
      - id: four-way-listen
        stage: structured_input
        generator: minimal_pair_identification
        prompt: "Only one of these is possible Turkish. Which one?"
        difficulty: 2
        params:
          modality: text
          contrast: suffix_vowel
          suffix: PRED1SG
          distractor: wrong_rounding
      - id: rounding-judgement
        stage: structured_input
        generator: grammaticality_judgement
        prompt: "Is this a possible Turkish word?"
        difficulty: 3
        params:
          suffix: PRED1SG
          distractor: wrong_rounding
      - id: build-fourfold
        stage: guided_output
        generator: suffix_builder
        prompt: "Say that you are this. Watch which of the four vowels the suffix takes."
        difficulty: 3
        params:
          suffix: PRED1SG
          show_derivation: true

  - id: predication-without-a-verb
    name: Predication is a suffix, not a verb
    type: grammatical_feature
    why_hard: >
      English requires a separate word for "am", "are" and "is". Turkish puts
      the person marking on the predicate itself, so learners either look for a
      missing verb or insert olmak, which is a different verb meaning "to
      become" and is wrong here.
    intro: >
      In English, saying what someone is takes a separate word: am, are, is. Turkish
      has no such word. Instead, a suffix attaches directly to the predicate itself:
      öğrenci, student, plus a suffix gives öğrenciyim, one word meaning I am a
      student. There is no verb to insert, and olmak, which is sometimes translated
      as to be, actually means to become and does not belong here. The exercises
      below show the suffix in context, so you can recognise who is being talked
      about before producing it yourself.
    teaches_suffixes: [PRED1SG, PRED2SG, PRED1PL, PRED2PL]
    exercises:
      - id: who-is-being-talked-about
        stage: structured_input
        generator: form_meaning_match
        prompt: "Who is this sentence about?"
        difficulty: 2
        params:
          cue: person_suffix_only
          persons: [PRED1SG, PRED2SG, PRED1PL, PRED2PL]
          lexeme_filter: { predicative_only: true }
      - id: person-contrast
        stage: structured_input
        generator: minimal_pair_identification
        # Both forms are well formed and differ only in who is being talked
        # about, so this genuinely needs audio and is not served yet. The same
        # contrast is covered in reading by who-is-being-talked-about above.
        # See docs/deferred-audio.md.
        prompt: "Did you hear I am, or you are?"
        difficulty: 2
        params:
          modality: audio
          contrast: person
          persons: [PRED1SG, PRED2SG]
          lexeme_filter: { predicative_only: true }
      - id: say-what-you-are
        stage: guided_output
        generator: cloze_suffix_choice
        prompt: "Complete the sentence."
        difficulty: 3
        params:
          persons: [PRED1SG, PRED2SG, PRED1PL, PRED2PL]
          lexeme_filter: { predicative_only: true }
      - id: predication-production
        stage: free_output
        generator: type_the_form
        prompt: "Say this in Turkish."
        difficulty: 4
        params:
          persons: [PRED1SG, PRED2SG, PRED1PL, PRED2PL]
          lexeme_filter: { predicative_only: true }
      - id: predication-recall
        stage: review
        generator: cued_recall
        difficulty: 3
        params:
          persons: [PRED1SG, PRED2SG, PRED1PL, PRED2PL]
          lexeme_filter: { predicative_only: true }

  - id: bare-third-person
    name: The third person is unmarked
    type: grammatical_feature
    why_hard: >
      Learners want a suffix for "is" because English has a word for it, and
      textbooks hand them -DIr. In ordinary speech the bare form is the neutral
      one and -DIr sounds official. This is a register problem disguised as a
      grammar problem.
    intro: >
      Everything so far has added a suffix to say I am or you are. The third person,
      is, works differently: in ordinary speech nothing is added at all. öğrenci on
      its own already means it is a student or he or she is a student, depending on
      context. A suffix does exist for this, but it belongs in formal or official
      language, not in the sentence you would actually say to a friend.
    review:
      - Confirm the register description of -DIr before this is shown to a learner
    teaches_suffixes: [PRED3SG]
    exercises:
      - id: notice-the-absence
        stage: structured_input
        generator: grammaticality_judgement
        prompt: "Does this sound like something a person would say?"
        difficulty: 3
        params:
          compare: [bare_predication, PRED3SG]
