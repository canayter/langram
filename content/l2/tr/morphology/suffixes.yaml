# Nominal suffixes, Phase 1 scope: number, possessive, case, predicative.
#
# Written in archiphoneme notation. A suffix is defined once and the engine
# generates every allomorph. No surface form appears in this file.
#
# Notation
#   A, I      harmonizing vowels (twofold, fourfold)
#   D, C      voicing-assimilating consonants
#   (x)       segment present only when needed:
#             a consonant appears after a vowel-final stem   -(y)I  araba-yi
#             a vowel appears after a consonant-final stem   -(I)m  ev-im
#
# slot ordering on the noun is: PL < POSS < CASE < PRED
# ev-ler-im-de-yim  "I am in my houses"

- id: PL
  surface: "-lAr"
  category: number
  slot: 1
  glosses: [plural]

- id: POSS1SG
  surface: "-(I)m"
  category: possessive
  slot: 2
  glosses: [my]

- id: POSS2SG
  surface: "-(I)n"
  category: possessive
  slot: 2
  # "(singular)" disambiguates from POSS2PL: English "your" does not mark
  # number, and an option list built from these glosses needs to.
  glosses: ["your (singular)", your]

- id: POSS3SG
  surface: "-(s)I"
  category: possessive
  slot: 2
  glosses: [his, her, its]
  # A case suffix after 3rd person possessive is separated by n:
  # ev-i -> ev-i-n-de, araba-si -> araba-si-nda
  triggers_pronominal_n: true

- id: POSS1PL
  surface: "-(I)mIz"
  category: possessive
  slot: 2
  glosses: [our]

- id: POSS2PL
  surface: "-(I)nIz"
  category: possessive
  slot: 2
  glosses: ["your (plural)", your]

- id: POSS3PL
  surface: "-lArI"
  category: possessive
  slot: 2
  glosses: [their]
  triggers_pronominal_n: true
  # The plural is already inside this suffix, so Turkish blocks the sequence:
  # there is no *kitaplarlari. "kitaplari" carries both readings, which is why
  # "his books" and "their books" are identical on the surface.
  cannot_follow: [PL]

- id: NOM
  surface: ""
  category: case
  slot: 3
  glosses: [nominative]

- id: ACC
  surface: "-(y)I"
  category: case
  slot: 3
  glosses: [accusative]
  # Marks specificity, not objecthood. Section 3.3 of the brief: this is one
  # of the structures English speakers get wrong most persistently.

- id: DAT
  surface: "-(y)A"
  category: case
  slot: 3
  glosses: [dative, to]

- id: LOC
  surface: "-DA"
  category: case
  slot: 3
  glosses: [locative, at, in]

- id: ABL
  surface: "-DAn"
  category: case
  slot: 3
  glosses: [ablative, from]

- id: GEN
  surface: "-(n)In"
  category: case
  slot: 3
  glosses: [genitive, of]

- id: INS
  surface: "-(y)lA"
  category: case
  slot: 3
  glosses: [instrumental, with]
  # Also written as the free word "ile". Pre-stressing, which the engine does
  # not model yet: stress falls on the syllable before it.
  review: [pre_stressing_not_modelled]

- id: PRED1SG
  surface: "-(y)Im"
  category: predicative
  slot: 4
  glosses: [I am]

- id: PRED2SG
  surface: "-sIn"
  category: predicative
  slot: 4
  # "(singular)" disambiguates from PRED2PL: English "you" does not mark
  # number, and an option list built from these glosses needs to.
  glosses: ["you are (singular)", you are]

- id: PRED3SG
  surface: "-DIr"
  category: predicative
  slot: 4
  glosses: [is]
  # Optional and formal in speech. Bare nominal predication is the neutral
  # form: "O öğrenci" rather than "O öğrencidir".

- id: PRED1PL
  surface: "-(y)Iz"
  category: predicative
  slot: 4
  glosses: [we are]

- id: PRED2PL
  surface: "-sInIz"
  category: predicative
  slot: 4
  glosses: ["you are (plural)", you are]

# ── Verbal, Phase 2 scope: negation and the present progressive ────────────
# Both scoped to the 3rd person (unmarked, see PRED3SG's precedent) until
# the verbal person endings themselves are built. See
# docs/pedagogy-rationale.md for why these two and not more yet.

- id: NEG
  surface: "-mA"
  category: negation
  slot: 5
  glosses: [not]

- id: PROG
  surface: "-(Ø)Iyor"
  category: tense
  slot: 6
  glosses: ["is, is -ing"]
  has_fixed_vowel: true
  # The o of -yor never harmonises; only the vowel the stem's own final
  # vowel is replaced by (via the Ø deletion) does. See engine.py's
  # stem_vowel_deletion step.

- id: ABIL
  surface: "-(y)Abil"
  category: tense
  slot: 6
  glosses: [can]
  has_fixed_vowel: true
  # bil is the frozen auxiliary root (from bilmek, to know) that gives this
  # construction its name; its own vowel never harmonises, only the A
  # before it does, so has_fixed_vowel is the genuine case that flag
  # exists for, not an escape from writing an archiphoneme. Confirmed
  # against multiple independent descriptions: oku -> okuyabilir,
  # gel -> gelebilir, yap -> yapabilir.

- id: ABILTENSE
  surface: "-Ir"
  category: tense
  slot: 7
  glosses: []
  # Only ever meant to follow ABIL, never used standalone. The general
  # aorist needs a per-verb high/low-vowel wordlist this project does not
  # have and has deliberately not built for exactly that reason (see
  # docs/pedagogy-rationale.md, unit 5). This is not that suffix: -bil is a
  # fixed syllable ending in front unrounded i, so whatever follows it
  # resolves against that i by ordinary fourfold harmony every time,
  # regardless of the original verb's own class -- gelebilir and
  # yapabilir both end in -ir, never -ar. Kept as its own suffix rather
  # than folded into one combined "-(y)AbilIr" because engine.py's
  # harmony_back override is fixed once per suffix application, not per
  # character within one suffix's own body: a single suffix spanning both
  # A and I would have forced I to inherit A's override too, giving the
  # wrong okuyabilır instead of okuyabilir. Splitting means this second
  # suffix starts with stem_exposed already false, which is exactly the
  # case harmony_back resetting to None was fixed for earlier this
  # project (see engine.py, and saat+PL+LOC in test_known_forms.py).
