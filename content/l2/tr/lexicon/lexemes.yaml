# Widened 2026-09-04: the predicative pool above (17 nouns) was small enough
# that a short session visibly repeated the same one or two words, reported
# directly by a learner. Kept to old, fully nativised Perso-Arabic loans (the
# same class as kitap, kalem, hesap already above, centuries old and not
# perceived as foreign) or genuinely native derivations, not recent European
# loans (avukat, sofor, patron, polis were all cut for exactly this: French
# or French-via-English, and nothing here needs that kind of word to keep
# the pool varied). All below end in a vowel or a non-alternating consonant
# (s, r), so none raise the final_voicing question either.
- { id: mühendis, lemma: mühendis, pos: noun, gloss: engineer,   predicate_natural: true }
- { id: sürücü,   lemma: sürücü,   pos: noun, gloss: driver,     predicate_natural: true, etymology: "Native Turkish: sürmek, to drive, plus the -(I)cI agent suffix. Not a loan, unlike şoför (French chauffeur)." }
- { id: misafir,  lemma: misafir,  pos: noun, gloss: guest,      predicate_natural: true }
- { id: yabancı,  lemma: yabancı,  pos: noun, gloss: stranger,   predicate_natural: true, etymology: "Native Turkish: yaban, wilderness or foreign place, plus -cı. Not a loan." }
- { id: hemşire,  lemma: hemşire,  pos: noun, gloss: nurse,      predicate_natural: true }

