# Turkish lexicon, Phase 1.
#
# Only stems and their lexically stored properties. No inflected form appears
# here or anywhere else outside this engine's output.
#
# Fields
#   final_voicing   stem-final p/c/t/k voices before a vowel-initial suffix.
#                   Required on every stem ending in one of those four, because
#                   it cannot be predicted from the surface form:
#                   kitap -> kitabi but sepet -> sepeti.
#   vowel_deletion  the last stem vowel drops before a vowel-initial suffix:
#                   burun -> burnu. A closed class, listed explicitly.
#   harmony_class   overrides the backness derived from the last vowel. Only
#                   present on disharmonic loans: saat is back on the surface
#                   and takes front suffixes (saatler).
#   review          anything a native speaker should confirm before this ships.
#
# frequency_band is deliberately absent. Bands come from a corpus list in
# Phase 2; inventing them here would put unsourced numbers in the curriculum.
# See docs/provenance.md.

